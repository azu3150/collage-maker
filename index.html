<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コラージュ一括メーカー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout concept: a light-table workbench. Photo strip on top, one settings block, then stacked contact sheets that each carry their own save. */
:root{
  --font-ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --bg:#ECF0F0;
  --panel:#FFFFFF;
  --panel-2:#F4F7F6;
  --ink:#172023;
  --ink-2:#56666A;
  --line:#D3DCDB;
  --accent:#0A7A6A;
  --accent-ink:#FFFFFF;
  --mark:#E8A200;
  --warn:#A8500A;
  --stage:#DCE4E3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121819;--panel:#192122;--panel-2:#202A2B;--ink:#E6EEEC;--ink-2:#93A5A3;--line:#2D3A3B;
    --accent:#3FC7AE;--accent-ink:#07201B;--mark:#FFC247;--warn:#FFB066;--stage:#0C1111;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121819;--panel:#192122;--panel-2:#202A2B;--ink:#E6EEEC;--ink-2:#93A5A3;--line:#2D3A3B;
  --accent:#3FC7AE;--accent-ink:#07201B;--mark:#FFC247;--warn:#FFB066;--stage:#0C1111;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:20px 0}
.wrap{max-width:760px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:30px;min-width:0}
h1{font-size:24px;line-height:1.25;font-weight:900;letter-spacing:.01em;margin:0 0 6px;text-wrap:balance}
.lede{margin:0;color:var(--ink-2);font-size:14px;max-width:36em}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:10px;margin-bottom:12px}
h2{margin:0;font-size:18px;font-weight:900;display:flex;align-items:center;gap:10px;text-wrap:balance}
.no{font:500 12px/1 var(--font-mono);background:var(--ink);color:var(--bg);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.sh-act{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:500;min-height:40px;padding:0 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.hint{margin:8px 0 0;font-size:12.5px;color:var(--ink-2)}
.sample{display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:13px;color:var(--ink-2)}
.pill{font:500 11px/1 var(--font-mono);letter-spacing:.06em;border:1.5px solid var(--warn);color:var(--warn);border-radius:99px;padding:4px 8px;flex:none}

/* photo tray */
.tray{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity}
.tray.drag{outline:2px dashed var(--accent);outline-offset:2px}
.th,.add{flex:0 0 76px;height:76px;border-radius:8px;position:relative;scroll-snap-align:start}
.add{border:2px dashed var(--ink-2);background:transparent;color:var(--ink-2);font:inherit;font-size:12px;display:grid;place-items:center;cursor:pointer;padding:0}
.add b{display:block;font-size:22px;line-height:1;font-weight:500}
.th{border:2px solid transparent;padding:0;background:var(--stage);overflow:hidden;cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .n{position:absolute;top:3px;left:3px;font:500 11px/1 var(--font-mono);background:rgba(0,0,0,.62);color:#fff;border-radius:4px;padding:3px 5px}
.th .u{position:absolute;left:0;right:0;bottom:0;font-size:11px;line-height:1;text-align:center;background:var(--warn);color:var(--bg);padding:3px 0;font-weight:700}
.th.cur{border-color:var(--mark);box-shadow:0 0 0 2px var(--ink)}
.th.loading{display:grid;place-items:center;font-size:11px;color:var(--ink-2);cursor:default}

/* layout chips */
.lays{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.lay{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink-2);font:inherit;font-size:12.5px;cursor:pointer;position:relative;min-width:0}
.lay[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.ord{position:absolute;top:4px;right:4px;font:500 11px/1 var(--font-mono);font-style:normal;background:var(--accent);color:var(--accent-ink);border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.ctl{display:grid;gap:2px;margin-top:14px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:46px}
.lab{flex:0 0 6em;font-size:13px;color:var(--ink-2);font-weight:500}
.row input[type=range]{flex:1 1 140px;min-width:0;accent-color:var(--accent)}
.row output{font-size:13px;min-width:4.5em;text-align:right}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:13px;min-height:36px;padding:0 12px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
select{font:inherit;font-size:13px;min-height:36px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0 8px;max-width:100%}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;flex:none}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
input[type=color]{width:32px;height:32px;padding:0;border:2px solid var(--line);border-radius:50%;background:none;cursor:pointer;flex:none}
.check{display:flex;gap:10px;align-items:center;font-size:14px;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.rebuild{margin-top:6px;justify-self:start}

/* sheets */
.sheets{display:grid;gap:18px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sheet-h{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:10px 12px}
.sheet-h h3{margin:0;font-size:14px;font-weight:700}
.sheet-h .meta{font-size:12px;color:var(--ink-2)}
.sheet-h select{margin-left:auto}
.stage{background:var(--stage);padding:12px}
.stage canvas{display:block;width:100%;height:auto;max-width:100%;touch-action:pan-y;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sheet.has-sel canvas{touch-action:none;cursor:grab}
.cellbar{padding:12px;border-top:1px solid var(--line);display:grid;gap:10px;background:var(--panel-2)}
.cb-t{margin:0;font-size:13px;font-weight:500}
.cb-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.zoom{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);flex:1 1 200px;min-width:0}
.zoom input{flex:1;min-width:0;accent-color:var(--accent)}
.zoom output{min-width:3.6em;text-align:right;color:var(--ink)}
.sheet-f{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line)}
.sheet-f span{font-size:12.5px;color:var(--ink-2)}
.empty{padding:32px 16px;text-align:center;color:var(--ink-2);border:1.5px dashed var(--line);border-radius:12px}
.bar-b{display:flex;gap:8px;flex-wrap:wrap}


/* bottom bar */
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom, 0px));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:5}
.bar p{margin:0;font-size:13px;color:var(--ink-2);min-width:0;flex:1 1 180px}
.bar .btn{flex:0 0 auto}

/* long-press save screen */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov-h{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line);z-index:1}
.ov-h p{margin:0;font-size:13.5px;font-weight:700}
.ov-body{display:grid;gap:18px;padding:16px 16px calc(24px + env(safe-area-inset-bottom, 0px));max-width:760px;margin-inline:auto}
.ov-body figure{margin:0;display:grid;gap:6px}
.ov-body img{display:block;width:100%;height:auto;border-radius:4px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.ov-body figcaption{font-size:12px;color:var(--ink-2)}
html{color-scheme:light}body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>コラージュ一括メーカー</h1>
    <p class="lede">写真をまとめて入れると、2分割・3分割・4分割・5分割に自動で並べます。枠の入れ替えや見せる位置の調整もできます。</p>
  </header>

  <section aria-labelledby="h-photos">
    <div class="sh">
      <h2 id="h-photos"><span class="no">1</span>写真</h2>
      <div class="sh-act">
        <button type="button" id="btnAdd" class="btn primary">写真を追加</button>
        <button type="button" id="btnClear" class="btn">すべて消す</button>
      </div>
    </div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <p id="sampleNote" class="sample" hidden><span class="pill">サンプル</span><span>いま表示中のコラージュは見本です。写真を追加すると置き換わります。</span></p>
    <div id="tray" class="tray" aria-label="読み込んだ写真"></div>
    <p id="trayHint" class="hint"></p>
  </section>

  <section aria-labelledby="h-layout">
    <div class="sh">
      <h2 id="h-layout"><span class="no">2</span>レイアウト</h2>
    </div>
    <div class="row" style="margin-bottom:6px"><span class="lab">商品</span><div class="seg" id="segPreset" role="group" aria-label="商品の種類"><button type="button" data-v="auto">おまかせ</button><button type="button" data-v="bag">バッグ</button><button type="button" data-v="wallet">財布</button></div></div>
    <p id="presetHint" class="hint" style="margin:0 0 12px"></p>
    <div id="lays" class="lays" role="group" aria-label="使うレイアウト"></div>
    <p class="hint">複数選ぶと、選んだ順にくり返し使います。レイアウトを変えると全体を並べ直します。</p>
    <div class="ctl">
      <div class="row">
        <span class="lab">仕上がり</span>
        <div class="seg" id="segAspect" role="group" aria-label="縦横比">
          <button type="button" data-v="1:1">正方形</button>
          <button type="button" data-v="3:4">縦長 3:4</button>
          <button type="button" data-v="4:3">横長 4:3</button>
        </div>
        <select id="selSize" aria-label="画像の大きさ">
          <option value="1000">長辺 1000px</option>
          <option value="1500">長辺 1500px</option>
          <option value="2000">長辺 2000px</option>
        </select>
      </div>
      <div class="row">
        <label class="lab" for="gap">写真の間隔</label>
        <input id="gap" type="range" min="0" max="6" step="0.1">
        <output id="gapOut" class="mono" for="gap"></output>
      </div>
      <div class="row">
        <label class="lab" for="margin">外側の余白</label>
        <input id="margin" type="range" min="0" max="6" step="0.1">
        <output id="marginOut" class="mono" for="margin"></output>
      </div>
      <div class="row">
        <span class="lab">背景色</span>
        <button type="button" class="sw" data-bg="#FFFFFF" style="background:#FFFFFF" aria-label="白"></button>
        <button type="button" class="sw" data-bg="#E9E9E9" style="background:#E9E9E9" aria-label="薄いグレー"></button>
        <button type="button" class="sw" data-bg="#111111" style="background:#111111" aria-label="黒"></button>
        <input id="bgCustom" type="color" value="#FFFFFF" aria-label="好きな色">
      </div>
      <div class="row">
        <span class="lab">写真の入れ方</span>
        <div class="seg" id="segFit" role="group" aria-label="写真の入れ方">
          <button type="button" data-v="cover">枠いっぱいに切り抜き</button>
          <button type="button" data-v="contain">全体を収める</button>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="smart">写真の向きに合わせて、枠の並びを自動で入れ替える</label>
      <button type="button" id="btnRebuild" class="btn rebuild">この設定で並べ直す</button>
    </div>
  </section>

  <section aria-labelledby="h-out">
    <div class="sh">
      <h2 id="h-out"><span class="no">3</span>仕上がり</h2>
      <div class="sh-act">
        <button type="button" id="btnResetAll" class="btn">一括リセット</button>
        <button type="button" id="btnMore" class="btn">未使用の写真で追加</button>
      </div>
    </div>
    <div id="sheets" class="sheets"></div>
  </section>

  <div class="bar">
    <p id="status" aria-live="polite"></p>
    <div class="bar-b"><button type="button" id="btnHold" class="btn primary">長押しで保存（全部）</button><button type="button" id="btnZip" class="btn">まとめて保存</button></div>
  </div>
</div>

<div id="ov" class="ov" hidden role="dialog" aria-modal="true" aria-label="長押しで保存">
  <div class="ov-h"><p>画像を長押しして「写真に保存」</p><button type="button" id="ovClose" class="btn">閉じる</button></div>
  <div id="ovBody" class="ov-body"></div>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var pad=function(n){return String(n).padStart(2,'0');};

var LAYOUTS=[
  {id:'l1',name:'1枚',cells:[[0,0,1,1]]},
  {id:'c2',name:'2枚 左右',cells:[[0,0,.5,1],[.5,0,.5,1]]},
  {id:'r2',name:'2枚 上下',cells:[[0,0,1,.5],[0,.5,1,.5]]},
  {id:'c3',name:'3枚 左右',cells:[[0,0,1/3,1],[1/3,0,1/3,1],[2/3,0,1/3,1]]},
  {id:'r3',name:'3枚 上下',cells:[[0,0,1,1/3],[0,1/3,1,1/3],[0,2/3,1,1/3]]},
  {id:'b3',name:'3枚 大+小',cells:[[0,0,.5,1],[.5,0,.5,.5],[.5,.5,.5,.5]]},
  {id:'g4',name:'4枚 2×2',cells:[[0,0,.5,.5],[.5,0,.5,.5],[0,.5,.5,.5],[.5,.5,.5,.5]]},
  {id:'m5a',name:'5枚 上2下3',cells:[[0,0,.5,.5],[.5,0,.5,.5],[0,.5,1/3,.5],[1/3,.5,1/3,.5],[2/3,.5,1/3,.5]]},
  {id:'m5c',name:'5枚 左2+右3',cells:[[0,0,.5,.5],[0,.5,.5,.5],[.5,0,.5,1/3],[.5,1/3,.5,1/3],[.5,2/3,.5,1/3]]},
  {id:'m5b',name:'5枚 大+小',cells:[[0,0,2/3,2/3],[2/3,0,1/3,1/3],[2/3,1/3,1/3,1/3],[0,2/3,.5,1/3],[.5,2/3,.5,1/3]]}
];
var FALLBACK={1:'l1',2:'c2',3:'b3',4:'g4'};
var PRESETS={bag:['g4','c2'],wallet:['r2','r2']};
var PRESET_HINT={auto:'',bag:'バッグ：写真を「角4枚 → 側面2枚」の順に入れると、角は2×2、側面は左右2分割になります。残りの写真は下で選んだレイアウトで並べます。',wallet:'財布：写真を「横サイド2枚 → 頭とおしり2枚」の順に入れると、どちらも上下2分割になります。残りの写真は下で選んだレイアウトで並べます。'};
var ASPECTS={'1:1':[1,1],'3:4':[3,4],'4:3':[4,3]};
var MAXSIDE=2000;
var layoutById=function(id){return LAYOUTS.filter(function(l){return l.id===id;})[0];};

var S={photos:[],collages:[],chosen:['g4'],preset:'bag',aspect:'1:1',size:1500,gap:0.6,margin:0.6,bg:'#FFFFFF',fit:'cover',smart:true,sel:null,swap:false,nid:1,cid:1,busy:false,loading:false};

var trayEl=$('#tray'),sheetsEl=$('#sheets'),laysEl=$('#lays'),statusEl=$('#status'),fileEl=$('#file');
var statusTimer=0;

/* ---------- geometry ---------- */
function dims(){
  var a=ASPECTS[S.aspect],L=S.size;
  return a[0]>=a[1]?{W:L,H:Math.round(L*a[1]/a[0])}:{W:Math.round(L*a[0]/a[1]),H:L};
}
function getRects(layoutId,W,H){
  var L=layoutById(layoutId),Ld=Math.max(W,H),g=S.gap/100*Ld,m=S.margin/100*Ld;
  var fx=m-g/2,fy=m-g/2,fw=W-2*fx,fh=H-2*fy;
  return L.cells.map(function(c){
    return {x:fx+c[0]*fw+g/2,y:fy+c[1]*fh+g/2,w:Math.max(1,c[2]*fw-g),h:Math.max(1,c[3]*fh-g)};
  });
}
function geom(r,p,sl){
  var s=sl.fit==='contain'?Math.min(r.w/p.w,r.h/p.h):Math.max(r.w/p.w,r.h/p.h)*sl.zoom;
  var dw=p.w*s,dh=p.h*s,ex=dw-r.w,ey=dh-r.h;
  return {dx:r.x+(ex>0?-ex*sl.fx:-ex/2),dy:r.y+(ey>0?-ey*sl.fy:-ey/2),dw:dw,dh:dh,ex:ex,ey:ey};
}
function photoById(id){for(var i=0;i<S.photos.length;i++){if(S.photos[i].id===id)return S.photos[i];}return null;}
function mkSlot(pid){return {pid:pid,fit:S.fit,zoom:1,fx:.5,fy:.5};}

/* ---------- drawing ---------- */
function drawSheet(ctx,W,H,c,o){
  o=o||{};
  ctx.fillStyle=S.bg;ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  var rs=getRects(c.layout,W,H);
  c.slots.forEach(function(sl,i){
    var r=rs[i],p=sl&&photoById(sl.pid);
    if(p){
      var g=geom(r,p,sl);
      ctx.save();ctx.beginPath();ctx.rect(r.x,r.y,r.w,r.h);ctx.clip();
      ctx.drawImage(p.img,g.dx,g.dy,g.dw,g.dh);
      ctx.restore();
    }else if(o.preview){
      ctx.fillStyle='rgba(128,128,128,.22)';ctx.fillRect(r.x,r.y,r.w,r.h);
      ctx.fillStyle='rgba(128,128,128,.9)';ctx.font='500 '+Math.round(Math.min(r.w,r.h)*.22)+'px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('＋',r.x+r.w/2,r.y+r.h/2);
    }
  });
  if(o.preview&&o.selIdx!=null&&rs[o.selIdx]){
    var q=rs[o.selIdx],lw=Math.max(3,W*.007);
    ctx.lineJoin='miter';
    ctx.strokeStyle='#1B1B1B';ctx.lineWidth=lw+3;ctx.strokeRect(q.x+lw/2,q.y+lw/2,q.w-lw,q.h-lw);
    ctx.strokeStyle='#F2A900';ctx.lineWidth=lw;ctx.strokeRect(q.x+lw/2,q.y+lw/2,q.w-lw,q.h-lw);
  }
}
function sheetEl(ci){return sheetsEl.children[ci];}
function drawAt(ci){
  var el=sheetEl(ci);if(!el)return;
  var cv=el.querySelector('canvas'),d=dims();
  var cssW=(cv.parentElement.clientWidth-24)||640;
  var pw=Math.max(240,Math.min(d.W,Math.round(cssW*Math.min(window.devicePixelRatio||1,2))));
  var ph=Math.round(pw*d.H/d.W);
  if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph;}
  var c=S.collages[ci];
  drawSheet(cv.getContext('2d'),pw,ph,c,{preview:true,selIdx:(S.sel&&S.sel.ci===ci)?S.sel.si:null});
  persistSoon();
}
function drawAll(){S.collages.forEach(function(_,i){drawAt(i);});}

/* ---------- auto layout ---------- */
function permute(arr,cb,k){
  k=k||0;
  if(k===arr.length){cb(arr);return;}
  for(var i=k;i<arr.length;i++){
    var t=arr[k];arr[k]=arr[i];arr[i]=t;
    permute(arr,cb,k+1);
    t=arr[k];arr[k]=arr[i];arr[i]=t;
  }
}
function assignGroup(ids,layoutId,keep){
  var L=layoutById(layoutId),d=dims();
  var order=ids.map(function(_,i){return i;});
  if(S.smart&&ids.length>1&&!keep){
    var ca=L.cells.map(function(c){return Math.log((c[2]*d.W)/(c[3]*d.H));});
    var pa=ids.map(function(id){var p=photoById(id);return Math.log(p.w/p.h);});
    var best=Infinity;
    permute(order.slice(),function(perm){
      var cost=0;perm.forEach(function(pi,k){cost+=Math.abs(pa[pi]-ca[k]);});
      if(cost<best-1e-9){best=cost;order=perm.slice();}
    });
  }
  return order.map(function(pi){return mkSlot(ids[pi]);});
}
function autoBuild(ids,startIdx){
  var out=[],i=0,k=0,start=startIdx||0,seq=S.chosen.length?S.chosen:['g4'],pre=PRESETS[S.preset]||[];
  while(i<ids.length){
    var pi=start+out.length,isPre=pi<pre.length,remain=ids.length-i;
    var lay=isPre?pre[pi]:seq[k%seq.length],n=layoutById(lay).cells.length;
    if(remain<n){
      var hit=isPre?null:seq.filter(function(id){return layoutById(id).cells.length===remain;})[0];
      lay=hit||FALLBACK[remain];n=remain;
    }
    var group=ids.slice(i,i+n);
    out.push({id:S.cid++,layout:lay,slots:assignGroup(group,lay,isPre)});
    i+=n;if(!isPre)k++;
  }
  return out;
}

function pt(cv,e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};}

  for(var i=0;i<rs.length;i++){var r=rs[i];if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return i;}
  return null;

function makeThumb(im,w,h){

}
async function photoFromBlob(blob,name,sample){
  var url=URL.createObjectURL(blob),im=await loadImg(url),w=im.naturalWidth,h=im.naturalHeight;
  if(Math.max(w,h)>MAXSIDE){
    var k=MAXSIDE/Math.max(w,h),cv=document.createElement('canvas');
    cv.width=Math.round(w*k);cv.height=Math.round(h*k);
    var cx=cv.getContext('2d');cx.imageSmoothingQuality='high';cx.drawImage(im,0,0,cv.width,cv.height);
    var small=await toBlob(cv,'image/jpeg',.92);
    URL.revokeObjectURL(url);
    url=URL.createObjectURL(small);blob=small;im=await loadImg(url);w=im.naturalWidth;h=im.naturalHeight;
  }
  return {id:S.nid++,name:name,img:im,w:w,h:h,thumb:makeThumb(im,w,h),sample:!!sample,blob:blob};
}
function rng(seed){var s=seed*9301+49297;return function(){s=(s*9301+49297)%233280;return s/233280;};}
async function makeSamples(){
  var specs=[[1200,1200],[1200,1200],[1600,1200],[1200,1200],[1200,1600],[1200,1200],[1200,1200],[1200,1200]];
  var pal=['#6B4A99','#ECE7DA','#5A5558','#CFCFCA','#8E58A8','#EFEAE0'];
  var out=[];
  for(var i=0;i<specs.length;i++){
    var w=specs[i][0],h=specs[i][1],cv=document.createElement('canvas');cv.width=w;cv.height=h;
    var cx=cv.getContext('2d'),r=rng(i+3);
    cx.fillStyle='#B9B4AE';cx.fillRect(0,0,w,h);
    cx.lineCap='butt';
    for(var k=0;k<11;k++){
      cx.strokeStyle=pal[Math.floor(r()*pal.length)];
      cx.lineWidth=Math.min(w,h)*(0.07+r()*0.05);
      cx.beginPath();
      var a0=r()*Math.PI*2;
      cx.arc(r()*w,r()*h,Math.min(w,h)*(0.14+r()*0.2),a0,a0+Math.PI*(0.8+r()*0.9));
      cx.stroke();
    }
    var gr=cx.createLinearGradient(0,h*.55,0,h);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(255,255,255,.55)');
    cx.fillStyle=gr;cx.fillRect(0,0,w,h);

    cx.lineWidth=Math.min(w,h)*.012;cx.strokeStyle='rgba(30,30,30,.75)';cx.fillStyle='#FFFFFF';

async function addFiles(list){
  var files=Array.prototype.slice.call(list).filter(function(f){return /^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name);});

  await ready;
  S.busy=true;S.loading=true;
  if(S.photos.some(function(p){return p.sample;})){S.photos=[];S.collages=[];S.sel=null;S.swap=false;renderAll();}

  var cdSize=0;cds.forEach(function(b){cdSize+=b.byteLength;});
  var eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(8,files.length,true);eo.setUint16(10,files.length,true);
  eo.setUint32(12,cdSize,true);eo.setUint32(16,off,true);
  return new Blob(parts.concat(cds,[eo.buffer]),{type:'application/zip'});
}
function saveError(err){
  var code=err&&err.code;
  if(code==='declined')updateStatus('保存をやめました。');
  else if(code==='rate_limited')updateStatus('少し待ってから、もう一度押してください。');
  else if(code==='too_large')updateStatus('ファイルが大きすぎます。サイズを小さくして試してください。');
  else updateStatus('保存できませんでした。');
}
async function saveOne(ci){
  var dl=await dlPromise;if(!dl)return;
  S.busy=true;updateStatus();
  try{
    statusEl.textContent='画像を作っています…';
    var blob=await renderBlob(ci);
    await dl.save({filename:'collage_'+pad(ci+1)+'.jpg',data:blob});
    S.busy=false;updateStatus('保存しました。');
  }catch(err){S.busy=false;saveError(err);}
  S.busy=false;
}
async function saveAll(){
  S.busy=true;updateStatus();
  try{
    var files=[];
    for(var i=0;i<S.collages.length;i++){
      statusEl.textContent='画像を作っています '+(i+1)+' / '+S.collages.length;
      var b=await renderBlob(i);files.push(new File([b],'collage_'+pad(i+1)+'.jpg',{type:'image/jpeg'}));
    }
    if(navigator.canShare&&navigator.canShare({files:files})){
      try{await navigator.share({files:files});S.busy=false;updateStatus('共有メニューを開きました。');return;}
      catch(e){if(e&&e.name==='AbortError'){S.busy=false;updateStatus('保存をやめました。');return;}}
    }
  }catch(_){S.busy=false;updateStatus('画像を作れませんでした。');return;}
  S.busy=false;
  await saveZip();
}
async function saveZip(){
  var dl=await dlPromise;if(!dl)return;
  S.busy=true;updateStatus();
  try{
    var files=[];
    for(var i=0;i<S.collages.length;i++){
      statusEl.textContent='画像を作っています '+(i+1)+' / '+S.collages.length;
      files.push({name:'collage_'+pad(i+1)+'.jpg',blob:await renderBlob(i)});
    }
    var zip=await makeZip(files),d=new Date();
    await dl.save({filename:'collages_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.zip',data:zip});
    S.busy=false;updateStatus('保存しました。');
  }catch(err){S.busy=false;saveError(err);}
  S.busy=false;
}

function resetData(c){
  var n=layoutById(c.layout).cells.length,ids=c.slots.filter(Boolean).map(function(s){return s.pid;});
  var slots=assignGroup(ids,c.layout);
  while(slots.length<n)slots.push(null);
  c.slots=slots;
}
function resetCollage(ci){
  var c=S.collages[ci];if(!c)return;
  resetData(c);
  if(S.sel&&S.sel.ci===ci){S.sel=null;S.swap=false;}
  drawAt(ci);refreshMeta();syncBars();renderTray();
  updateStatus('コラージュ '+(ci+1)+' をリセットしました。');
}
var resetArm=0;
function resetAll(){
  var b=$('#btnResetAll');
  if(!resetArm){
    b.textContent='もう一度押すと全部リセット';
    resetArm=setTimeout(function(){resetArm=0;b.textContent='一括リセット';},3000);
    return;
  }
  clearTimeout(resetArm);resetArm=0;b.textContent='一括リセット';
  S.collages.forEach(function(c){resetData(c);});
  S.sel=null;S.swap=false;
  renderAll();updateStatus('すべてのコラージュをリセットしました。');
}

async function renderDataUrl(ci){
  var d=dims(),cv=document.createElement('canvas');cv.width=d.W;cv.height=d.H;
  drawSheet(cv.getContext('2d'),d.W,d.H,S.collages[ci],{});
  await new Promise(function(r){setTimeout(r,0);});
  return cv.toDataURL('image/jpeg',.92);
}
async function showHold(list){
  if(S.busy||!list.length)return;
  S.busy=true;updateStatus();
  var body=$('#ovBody'),ok=true,d=dims();body.innerHTML='';
  try{
    for(var i=0;i<list.length;i++){
      statusEl.textContent='画像を作っています '+(i+1)+' / '+list.length;
      var ci=list[i],url=await renderDataUrl(ci);
      var fig=document.createElement('figure'),im=document.createElement('img'),cap=document.createElement('figcaption');
      im.src=url;im.alt='コラージュ '+(ci+1);
      cap.textContent='コラージュ '+(ci+1)+' · '+d.W+'×'+d.H+'px';
      fig.appendChild(im);fig.appendChild(cap);body.appendChild(fig);
    }
    $('#ov').hidden=false;$('#ov').scrollTop=0;document.body.style.overflow='hidden';
  }catch(_){ok=false;}
  S.busy=false;updateStatus(ok?'':'画像を作れませんでした。');
}
function closeHold(){$('#ov').hidden=true;document.body.style.overflow='';$('#ovBody').innerHTML='';}

/* ---------- events ---------- */
$('#btnAdd').addEventListener('click',function(){fileEl.click();});
fileEl.addEventListener('change',function(){if(fileEl.files&&fileEl.files.length)addFiles(fileEl.files);fileEl.value='';});
var clearArm=0;
$('#btnClear').addEventListener('click',function(){
  var b=$('#btnClear');
  if(!clearArm){b.textContent='もう一度押すと消えます';clearArm=setTimeout(function(){clearArm=0;b.textContent='すべて消す';},3000);return;}
  clearTimeout(clearArm);clearArm=0;
  S.photos=[];S.collages=[];S.sel=null;S.swap=false;renderAll();
});
trayEl.addEventListener('click',function(e){
  if(e.target.closest('#tileAdd')){fileEl.click();return;}
  var t=e.target.closest('.th[data-pid]');if(!t)return;
  assignPhoto(Number(t.dataset.pid));
});
['dragenter','dragover'].forEach(function(n){trayEl.addEventListener(n,function(e){e.preventDefault();trayEl.classList.add('drag');});});
['dragleave','drop'].forEach(function(n){trayEl.addEventListener(n,function(){trayEl.classList.remove('drag');});});
trayEl.addEventListener('drop',function(e){e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);});

laysEl.addEventListener('click',function(e){
  var b=e.target.closest('.lay');if(!b)return;
  var id=b.dataset.id,i=S.chosen.indexOf(id);
  if(i>=0){if(S.chosen.length===1){updateStatus('レイアウトは最低1つ選びます。');return;}S.chosen.splice(i,1);}
  else S.chosen.push(id);
  rebuildAll();
});
$('#segPreset').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;S.preset=b.dataset.v;rebuildAll();
});
$('#segAspect').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;S.aspect=b.dataset.v;syncControls();refreshMeta();drawAll();
});
$('#selSize').addEventListener('change',function(e){S.size=Number(e.target.value);refreshMeta();});
$('#gap').addEventListener('input',function(e){S.gap=Number(e.target.value);$('#gapOut').textContent=S.gap.toFixed(1)+'%';drawAll();});
$('#margin').addEventListener('input',function(e){S.margin=Number(e.target.value);$('#marginOut').textContent=S.margin.toFixed(1)+'%';drawAll();});
document.querySelectorAll('.sw').forEach(function(b){b.addEventListener('click',function(){S.bg=b.dataset.bg;syncControls();drawAll();});});
$('#bgCustom').addEventListener('input',function(e){S.bg=e.target.value;syncControls();drawAll();});
$('#segFit').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  S.fit=b.dataset.v;
  S.collages.forEach(function(c){c.slots.forEach(function(sl){if(sl){sl.fit=S.fit;sl.zoom=1;sl.fx=.5;sl.fy=.5;}});});
  syncControls();syncBars();drawAll();
});
$('#smart').addEventListener('change',function(e){S.smart=e.target.checked;rebuildAll();});
$('#btnRebuild').addEventListener('click',rebuildAll);
$('#btnMore').addEventListener('click',function(){
  var ids=unusedIds();if(!ids.length)return;
  S.collages=S.collages.concat(autoBuild(ids,S.collages.length));renderAll();
});
$('#btnZip').addEventListener('click',saveAll);
$('#btnHold').addEventListener('click',function(){showHold(S.collages.map(function(_,i){return i;}));});
$('#ovClose').addEventListener('click',closeHold);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#ov').hidden)closeHold();});
$('#btnResetAll').addEventListener('click',resetAll);

sheetsEl.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;
  var sh=b.closest('.sheet');if(!sh)return;
  var ci=Number(sh.dataset.i),act=b.dataset.act,sl=S.sel&&S.sel.ci===ci?slotAt(S.sel):null;
  if(act==='resetsheet'){resetCollage(ci);return;}
  if(act==='hold'){showHold([ci]);return;}
  if(act==='save'){saveOne(ci);return;}
  if(act==='del'){
    S.collages.splice(ci,1);S.sel=null;S.swap=false;renderAll();return;
  }
  if(!sl&&act!=='swap')return;
  if(act==='fit-cover'||act==='fit-contain'){sl.fit=act==='fit-cover'?'cover':'contain';sl.zoom=1;sl.fx=.5;sl.fy=.5;drawAt(ci);syncBars();}
  else if(act==='reset'){sl.zoom=1;sl.fx=.5;sl.fy=.5;drawAt(ci);syncBars();}
  else if(act==='swap'){if(slotAt(S.sel)){S.swap=!S.swap;syncBars();renderTray();}}
  else if(act==='clearcell'){S.collages[ci].slots[S.sel.si]=null;S.swap=false;drawAt(ci);refreshMeta();syncBars();renderTray();updateStatus();}
});
sheetsEl.addEventListener('input',function(e){
  var z=e.target.closest('[data-act="zoom"]');if(!z)return;
  var ci=Number(z.closest('.sheet').dataset.i),sl=S.sel&&S.sel.ci===ci?slotAt(S.sel):null;if(!sl)return;
  sl.zoom=Number(z.value)/100;z.parentElement.querySelector('output').textContent=z.value+'%';drawAt(ci);
});
sheetsEl.addEventListener('change',function(e){
  var s=e.target.closest('[data-act="layout"]');if(!s)return;
  var ci=Number(s.closest('.sheet').dataset.i),c=S.collages[ci],n=layoutById(s.value).cells.length;
  c.layout=s.value;
  var slots=c.slots.slice(0,n);while(slots.length<n)slots.push(null);c.slots=slots;
  S.sel=null;S.swap=false;
  renderAll();
});

/* ---------- start ---------- */
/* ---------- keep work across reloads (browser storage) ---------- */
var store=null,storedIds={},pTimer=0;
function openStore(){
  return new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error('noidb'));return;}
    var r=indexedDB.open('collage-maker',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('kv');};
    r.onsuccess=function(){res(r.result);};
    r.onerror=function(){rej(r.error);};
  });
}
function kvGet(k){
  return new Promise(function(res,rej){
    var q=store.transaction('kv','readonly').objectStore('kv').get(k);
    q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};
  });
}
function persistSoon(){if(!store)return;clearTimeout(pTimer);pTimer=setTimeout(persistNow,600);}
function persistNow(){
  if(!store||S.loading||S.photos.some(function(p){return p.sample;}))return;
  try{
    var tx=store.transaction('kv','readwrite'),os=tx.objectStore('kv'),keep={};
    S.photos.forEach(function(p){
      keep[p.id]=1;
      if(!storedIds[p.id]&&p.blob){os.put(p.blob,'photo:'+p.id);storedIds[p.id]=1;}
    });
    Object.keys(storedIds).forEach(function(id){if(!keep[id]){os.delete('photo:'+id);delete storedIds[id];}});
    os.put({
      v:1,preset:S.preset,chosen:S.chosen,aspect:S.aspect,size:S.size,gap:S.gap,margin:S.margin,bg:S.bg,fit:S.fit,smart:S.smart,nid:S.nid,cid:S.cid,
      photos:S.photos.map(function(p){return {id:p.id,name:p.name};}),
      collages:S.collages.map(function(c){
        return {id:c.id,layout:c.layout,slots:c.slots.map(function(s){return s?{pid:s.pid,fit:s.fit,zoom:s.zoom,fx:s.fx,fy:s.fy}:null;})};
      })
    },'state');
  }catch(_){}
}
async function restore(){
  if(!store)return false;
  var snap=await kvGet('state');
  if(!snap||!snap.photos)return false;
  var photos=[],have={};
  for(var i=0;i<snap.photos.length;i++){
    var m=snap.photos[i],blob=await kvGet('photo:'+m.id);
    if(!blob)continue;
    var im=await loadImg(URL.createObjectURL(blob)),w=im.naturalWidth,h=im.naturalHeight;
    photos.push({id:m.id,name:m.name,img:im,w:w,h:h,thumb:makeThumb(im,w,h),sample:false,blob:blob});
    have[m.id]=1;storedIds[m.id]=1;
  }
  S.photos=photos;
  ['preset','aspect','size','gap','margin','bg','fit','smart'].forEach(function(k){if(snap[k]!==undefined)S[k]=snap[k];});
  if(snap.chosen&&snap.chosen.length)S.chosen=snap.chosen;
  S.nid=Math.max(snap.nid||1,photos.reduce(function(a,p){return Math.max(a,p.id+1);},1));
  S.cid=snap.cid||1;
  S.collages=(snap.collages||[]).filter(function(c){return layoutById(c.layout);}).map(function(c){
    var n=layoutById(c.layout).cells.length,slots=[];
    for(var k=0;k<n;k++){
      var s=c.slots&&c.slots[k];
      slots.push(s&&have[s.pid]?{pid:s.pid,fit:s.fit==='contain'?'contain':'cover',zoom:Number(s.zoom)||1,fx:isNaN(s.fx)?.5:s.fx,fy:isNaN(s.fy)?.5:s.fy}:null);
    }
    return {id:c.id,layout:c.layout,slots:slots};
  });
  S.sel=null;S.swap=false;
  return true;
}
document.addEventListener('visibilitychange',function(){if(document.hidden)persistNow();});
window.addEventListener('pagehide',persistNow);

/* ---------- start ---------- */
S.loading=true;
renderAll();
ready=(async function(){
  var restored=false;
  try{store=await openStore();restored=await restore();}catch(_){restored=false;}
  if(restored){S.loading=false;renderAll();return;}
  try{
    var samples=await makeSamples();
    S.loading=false;
    if(!S.photos.length){S.photos=samples;rebuildAll();}
  }catch(_){S.loading=false;renderAll();}
})();
})();
</script>
